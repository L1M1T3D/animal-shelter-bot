spring.application.name=animal-shelter
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/animal_shelter}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

app.time-zone=Asia/Almaty
app.report-reminder-cron=0 0 10 * * *
telegram.volunteer-chat-id=${TELEGRAM_VOLUNTEER_CHAT_ID:}

shelter.public.address=${SHELTER_ADDRESS:Адрес уточняется у волонтёра}
shelter.public.hours=${SHELTER_HOURS:Время работы уточняется у волонтёра}
shelter.public.contact=${SHELTER_CONTACT:Контакты уточняются у волонтёра}
